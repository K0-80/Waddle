<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waddle</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <canvas
      id="pet-canvas"
      aria-label="Your goose and other online geese"
    ></canvas>
    <section id="auth-panel" class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card interactive">
        <header class="auth-header">
          <div class="auth-mark" aria-hidden="true">
            <img src="/src/assets/icon.png" alt="" width="64" height="64" />
          </div>
          <div>
            <h1 id="auth-title">Waddle</h1>
            <p>A tiny, unhinged goose that lives on your friend's desktop in real time! </p>
          </div>
        </header>
        <form id="auth-form" class="auth-form">
          <label id="username-field" class="auth-field" hidden>
            <span>Username</span>
            <input
              id="auth-username"
              name="username"
              type="text"
              minlength="3"
              maxlength="20"
              autocomplete="username"
              pattern="[A-Za-z0-9_]{3,20}"
              placeholder="Big G"
            />
          </label>
          <label class="auth-field">
            <span>Email</span>
            <input
              id="auth-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="gooseboi@goosemail.com"
              required
            />
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input
              id="auth-password"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="6"
              placeholder="boigoose123"
              required
            />
          </label>
          <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
          <div class="auth-actions">
            <button id="auth-submit" class="primary-button" type="submit">Sign in</button>
            <button id="auth-mode-toggle" class="text-button" type="button">
              New Here? Create an account
            </button>
          </div>
        </form>
      </div>
    </section>
    <aside id="session-bar" class="interactive" hidden>
      <section
        id="session-menu"
        class="account-menu"
        aria-label="Goose profile menu"
        hidden
      >
        <header class="account-menu-header">
          <span id="session-name"></span>
          <span id="local-connection-status" class="connection-status">
            <span
              id="connection-indicator"
              class="connection-indicator offline"
              role="img"
              aria-label="Offline"
              title="Offline"
            >⏺</span>
            <span id="connection-status">Offline</span>
          </span>
        </header>
        <section id="local-profile">
          <div class="about-me-field">
            <div class="about-me-label-row">
              <label for="about-me-input">About me</label>
              <span id="about-me-status" role="status" aria-live="polite"></span>
            </div>
            <textarea
              id="about-me-input"
              name="about-me"
              maxlength="160"
              rows="1"
              placeholder="A little about you..."
            ></textarea>
          </div>
        </section>
        <section id="remote-profile" hidden>
          <p id="remote-about-me" class="remote-about-me"></p>
        </section>
        <div id="local-menu-content">
          <section
            id="room-panel"
            class="room-panel"
            aria-label="Multiplayer room"
          >
            <div id="room-setup">
              <h2>Find your flock</h2>
              <form id="room-form">
                <label class="room-field" for="room-name">
                  <span>Room name</span>
                  <input
                    id="room-name"
                    name="room-name"
                    type="text"
                    minlength="3"
                    maxlength="32"
                    autocomplete="off"
                    pattern="[A-Za-z0-9][A-Za-z0-9 _-]{1,31}"
                    placeholder="Waddle-Gang"
                    required
                  />
                </label>
                <div class="room-actions">
                  <button id="join-flock" class="primary-button join-flock-button" type="submit">
                    Join Flock!
                  </button>
                </div>
              </form>
            </div>
            <div id="room-details" hidden>
              <h2>In the flock</h2>
              <div class="room-detail">
                <span>Players</span>
                <strong id="room-player-count">1 / 6</strong>
              </div>
              <div class="room-detail">
                <span>Room code</span>
                <code id="room-code"></code>
              </div>
              <div class="room-detail">
                <span>Online for</span>
                <time id="room-online-time">00:00</time>
              </div>
              <button id="leave-room" class="secondary-button" type="button">
                Leave room
              </button>
            </div>
            <p
              id="room-feedback"
              class="room-feedback"
              role="status"
              aria-live="polite"
            ></p>
          </section>
          <footer class="account-menu-actions">
            <button id="settings" class="secondary-button settings-button" type="button">
              Settings
            </button>
            <button id="exit-menu" class="secondary-button danger-button" type="button">
              Exit
            </button>
          </footer>
        </div>
        <section id="settings-content" aria-label="Settings" hidden>
          <h2>Settings</h2>
          <div class="settings-fields">
            <label class="setting-toggle">
              <span>Always on top</span>
              <input id="always-on-top" type="checkbox" checked />
            </label>
            <label class="setting-toggle">
              <span>Mute when unfocused</span>
              <input id="mute-unfocused" type="checkbox" />
            </label>
            <label class="setting-toggle">
              <span>Always show nametags</span>
              <input id="always-show-nametags" type="checkbox" />
            </label>
            <label class="setting-field" for="volume-input">
              <span>Volume</span>
              <span class="settings-volume">
                <input
                  id="volume-input"
                  type="range"
                  min="0"
                  max="1"
                  step="0.05"
                  value="1"
                />
                <output id="volume-value" for="volume-input">100%</output>
              </span>
            </label>
          </div>
          <p id="settings-status" role="status" aria-live="polite"></p>
          <div class="settings-menu-actions">
            <button id="sign-out" class="secondary-button danger-button" type="button">
              Sign out
            </button>
            <button id="settings-back" class="secondary-button" type="button">
              Back
            </button>
          </div>
        </section>
      </section>
    </aside>
  </body>
</html>
